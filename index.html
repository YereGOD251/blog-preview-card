<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>

  <main>
    <article class="card">

      <a href="#" class="card__image-link" aria-label="Read HTML &amp; CSS foundations article">
        <img
          class="card__image"
          src="./assets/images/illustration-article.svg"
          alt="Abstract illustration representing HTML and CSS"
          width="336"
          height="201"
        >
      </a>

      <div class="card__body">

        <a href="#" class="card__tag">Learning</a>

        <p class="card__date">
          <time datetime="2023-12-21">Published 21 Dec 2023</time>
        </p>

        <h1 class="card__title">
          <a href="#" class="card__title-link">HTML &amp; CSS foundations</a>
        </h1>

        <p class="card__description">
          These languages are the backbone of every website, defining
          structure, content, and presentation.
        </p>

        <div class="card__author">
          <img
            class="card__avatar"
            src="./assets/images/image-avatar.webp"
            alt="Greg Hooper avatar"
            width="32"
            height="32"
          >
          <span class="card__author-name">yeremi Q</span>
        </div>

      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>.
    Coded by <a href="https://github.com/yereGOD251" target="_blank" rel="noopener">Yeremi Q</a>.
  </footer>

</body>
</html>
